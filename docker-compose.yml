version: '3.9'

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    container_name: pulselink-redpanda
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--api-urls", "localhost:9644"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  redis:
    image: redis:7-alpine
    container_name: pulselink-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: pulselink-postgres
    environment:
      POSTGRES_DB: pulselink
      POSTGRES_USER: pulselink
      POSTGRES_PASSWORD: pulselink123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulselink -d pulselink"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api-service:
    build:
      context: ./api-service
      dockerfile: Dockerfile
    container_name: pulselink-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://pulselink:pulselink123@postgres:5432/pulselink
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: redpanda:29092
      SECRET_KEY: dev-secret-key-change-in-production
      AWS_BUCKET_NAME: pulselink-screenshots
      AWS_REGION: us-east-1
      ENVIRONMENT: development
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker-service:
    build:
      context: ./worker-service
      dockerfile: Dockerfile
    container_name: pulselink-worker
    environment:
      DATABASE_URL: postgresql://pulselink:pulselink123@postgres:5432/pulselink
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: redpanda:29092
      SECRET_KEY: dev-secret-key-change-in-production
      AWS_BUCKET_NAME: ""
      AWS_REGION: us-east-1
      ENVIRONMENT: development
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulselink-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api-service
    restart: unless-stopped

volumes:
  redpanda_data:
  redis_data:
  postgres_data:

