# kind cluster configuration for local Kubernetes testing
# Usage: kind create cluster --config kind-config.yaml --name pulselink
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pulselink
nodes:
  - role: control-plane
    extraPortMappings:
      # Frontend (LoadBalancer) → localhost:80
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      # API Service → localhost:8000
      - containerPort: 30800
        hostPort: 8000
        protocol: TCP
  - role: worker
  - role: worker
