apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  labels:
    app: pulselink
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulselink
      component: api
  template:
    metadata:
      labels:
        app: pulselink
        component: api
    spec:
      containers:
        - name: api-service
          image: <ECR_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/pulselink-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: pulselink-config
            - secretRef:
                name: pulselink-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  labels:
    app: pulselink
    component: api
spec:
  type: ClusterIP
  selector:
    app: pulselink
    component: api
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
