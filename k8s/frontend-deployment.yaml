apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: pulselink
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulselink
      component: frontend
  template:
    metadata:
      labels:
        app: pulselink
        component: frontend
    spec:
      containers:
        - name: frontend
          image: <ECR_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/pulselink-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://api-service:8000"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: pulselink
    component: frontend
spec:
  type: LoadBalancer
  selector:
    app: pulselink
    component: frontend
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
