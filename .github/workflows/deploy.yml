name: Deploy PulseLink

on:
  push:
    branches: [main]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install api-service dependencies
        run: pip install -r api-service/requirements.txt

      - name: Install worker-service dependencies
        run: pip install -r worker-service/requirements.txt

      - name: Install test dependencies
        run: pip install pytest httpx pytest-asyncio

      - name: Syntax check all Python files
        run: |
          find api-service worker-service -name "*.py" -exec python -m py_compile {} +
          echo "All Python files passed syntax check"

      - name: Run api-service tests
        run: |
          if [ -d "api-service/tests" ]; then
            python -m pytest api-service/tests/ -v
          else
            echo "No api-service tests found, skipping"
          fi

      - name: Run worker-service tests
        run: |
          if [ -d "worker-service/tests" ]; then
            python -m pytest worker-service/tests/ -v
          else
            echo "No worker-service tests found, skipping"
          fi

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push api-service image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/pulselink-api:latest -t $REGISTRY/pulselink-api:$IMAGE_TAG api-service/
          docker push $REGISTRY/pulselink-api:latest
          docker push $REGISTRY/pulselink-api:$IMAGE_TAG

      - name: Build and push worker-service image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/pulselink-worker:latest -t $REGISTRY/pulselink-worker:$IMAGE_TAG worker-service/
          docker push $REGISTRY/pulselink-worker:latest
          docker push $REGISTRY/pulselink-worker:$IMAGE_TAG

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/pulselink-frontend:latest -t $REGISTRY/pulselink-frontend:$IMAGE_TAG frontend/
          docker push $REGISTRY/pulselink-frontend:latest
          docker push $REGISTRY/pulselink-frontend:$IMAGE_TAG

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/pulselink

            # Login to ECR
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            # Pull latest images and restart
            docker compose pull
            docker compose up -d

            # Clean up old images
            docker system prune -f

            # Health check
            echo "Waiting for services to start..."
            sleep 10

            HEALTH=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health)
            if [ "$HEALTH" != "200" ]; then
              echo "Health check failed with status $HEALTH"
              docker compose logs --tail 50
              exit 1
            fi

            echo "Deployment successful! Health check passed."
