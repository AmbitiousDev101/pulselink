name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install api-service dependencies
        run: pip install -r api-service/requirements.txt

      - name: Install worker-service dependencies
        run: pip install -r worker-service/requirements.txt

      - name: Install test dependencies
        run: pip install pytest httpx pytest-asyncio

      - name: Syntax check all Python files
        run: |
          find api-service worker-service -name "*.py" -exec python -m py_compile {} +
          echo "All Python files passed syntax check"

      - name: Run api-service tests
        run: |
          if [ -d "api-service/tests" ]; then
            python -m pytest api-service/tests/ -v
          else
            echo "No api-service tests found, skipping"
          fi

      - name: Run worker-service tests
        run: |
          if [ -d "worker-service/tests" ]; then
            python -m pytest worker-service/tests/ -v
          else
            echo "No worker-service tests found, skipping"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
